<!DOCTYPE html>
<html lang="vi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 min-h-screen">

<div class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-8">

        <div class="text-center mb-8">

            <h1 class="text-3xl font-bold text-gray-800">
                Tạo tài khoản
            </h1>

            <p class="text-gray-500 mt-2">
                Đăng ký để bắt đầu mua sắm
            </p>

        </div>


        {% if error %}
        <div class="bg-red-100 text-red-600 p-3 rounded-lg mb-5 text-sm">
            {{ error }}
        </div>
        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="mb-4">

                <label class="block text-sm font-semibold mb-2">
                    Tên đăng nhập
                </label>

                <input
                    type="text"
                    name="username"
                    required
                    class="w-full border rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Nhập tên đăng nhập"
                >

            </div>


            <div class="mb-4">

                <label class="block text-sm font-semibold mb-2">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="w-full border rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Nhập email"
                >

            </div>


            <div class="mb-4">

                <label class="block text-sm font-semibold mb-2">
                    Mật khẩu
                </label>

                <input
                    type="password"
                    name="password"
                    required
                    class="w-full border rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Nhập mật khẩu"
                >

            </div>


            <div class="mb-6">

                <label class="block text-sm font-semibold mb-2">
                    Nhập lại mật khẩu
                </label>

                <input
                    type="password"
                    name="password2"
                    required
                    class="w-full border rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Nhập lại mật khẩu"
                >

            </div>


            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition"
            >
                Đăng ký
            </button>

        </form>


        <div class="text-center mt-6 text-sm text-gray-500">

            Đã có tài khoản?

            <a
                href="{% url 'accounts:login' %}"
                class="text-blue-600 font-semibold hover:underline"
            >
                Đăng nhập
            </a>

        </div>

    </div>

</div>

</body>
</html>
