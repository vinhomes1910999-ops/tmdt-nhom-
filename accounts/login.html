<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<div class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-8">

        <div class="text-center mb-8">

            <h1 class="text-3xl font-bold text-gray-800">
                Đăng nhập
            </h1>

            <p class="text-gray-500 mt-2">
                Chào mừng bạn quay trở lại
            </p>

        </div>


        {% if error %}
        <div class="bg-red-100 text-red-600 p-3 rounded-lg mb-5 text-sm">
            {{ error }}
        </div>
        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <div class="mb-5">

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Tên đăng nhập
                </label>

                <input
                    type="text"
                    name="username"
                    required
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Nhập tên đăng nhập"
                >

            </div>


            <div class="mb-6">

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Mật khẩu
                </label>

                <input
                    type="password"
                    name="password"
                    required
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Nhập mật khẩu"
                >

            </div>


            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition"
            >
                Đăng nhập
            </button>

        </form>


        <div class="text-center mt-6 text-sm text-gray-500">

            Chưa có tài khoản?

            <a
                href="{% url 'accounts:register' %}"
                class="text-blue-600 font-semibold hover:underline"
            >
                Đăng ký
            </a>

        </div>


        <a
            href="/"
            class="block text-center mt-4 text-gray-500 hover:text-blue-600 text-sm"
        >
            ← Về trang chủ
        </a>

    </div>

</div>

</body>
</html>
