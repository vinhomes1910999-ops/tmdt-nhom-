<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Thanh toán</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100">


<div class="max-w-6xl mx-auto px-4 py-10">


    <h1 class="text-3xl font-bold mb-8">
        Thanh toán
    </h1>


    <form method="POST">

        {% csrf_token %}


        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">


            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm">


                <h2 class="text-xl font-bold mb-6">
                    Thông tin nhận hàng
                </h2>


                <div class="mb-5">

                    <label class="block font-medium mb-2">
                        Họ và tên
                    </label>

                    <input
                        type="text"
                        name="full_name"
                        required
                        class="w-full border rounded-lg px-4 py-3"
                        placeholder="Nhập họ và tên"
                    >

                </div>


                <div class="mb-5">

                    <label class="block font-medium mb-2">
                        Số điện thoại
                    </label>

                    <input
                        type="text"
                        name="phone"
                        required
                        class="w-full border rounded-lg px-4 py-3"
                        placeholder="Nhập số điện thoại"
                    >

                </div>


                <div class="mb-5">

                    <label class="block font-medium mb-2">
                        Địa chỉ
                    </label>

                    <textarea
                        name="address"
                        rows="4"
                        required
                        class="w-full border rounded-lg px-4 py-3"
                        placeholder="Nhập địa chỉ nhận hàng"
                    ></textarea>

                </div>


                <h2 class="text-xl font-bold mb-4">
                    Phương thức thanh toán
                </h2>


                <div class="space-y-3">


                    <label class="flex items-center border p-4 rounded-lg cursor-pointer">

                        <input
                            type="radio"
                            name="payment_method"
                            value="COD"
                            checked
                            class="mr-3"
                        >

                        <div>

                            <p class="font-semibold">
                                Thanh toán khi nhận hàng
                            </p>

                            <p class="text-sm text-gray-500">
                                Thanh toán tiền mặt khi nhận sản phẩm
                            </p>

                        </div>

                    </label>


                    <label class="flex items-center border p-4 rounded-lg cursor-pointer">

                        <input
                            type="radio"
                            name="payment_method"
                            value="ONLINE"
                            class="mr-3"
                        >

                        <div>

                            <p class="font-semibold">
                                Thanh toán online
                            </p>

                            <p class="text-sm text-gray-500">
                                Thanh toán trực tuyến
                            </p>

                        </div>

                    </label>


                </div>


            </div>


            <div class="bg-white p-6 rounded-xl shadow-sm h-fit">


                <h2 class="text-xl font-bold border-b pb-4 mb-5">
                    Đơn hàng
                </h2>


                {% for item in cart_items %}

                <div class="flex justify-between mb-4">

                    <div>

                        <p class="font-medium">
                            {{ item.product.name }}
                        </p>

                        <p class="text-sm text-gray-500">
                            x {{ item.quantity }}
                        </p>

                    </div>

                    <p>
                        {{ item.subtotal }} đ
                    </p>

                </div>

                {% endfor %}


                <div class="border-t pt-4 flex justify-between">

                    <span class="font-bold">
                        Tổng cộng
                    </span>

                    <span class="font-bold text-red-600">
                        {{ total_price }} đ
                    </span>

                </div>


                <button
                    type="submit"
                    class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg mt-6 hover:bg-blue-700"
                >
                    Đặt hàng
                </button>


            </div>


        </div>


    </form>


</div>


</body>

</html>
